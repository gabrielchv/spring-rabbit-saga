name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, payment-service, inventory-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.service }}-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}

      - name: Test ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress test
        working-directory: ${{ matrix.service }}

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: >
          ./mvnw --batch-mode --no-transfer-progress verify sonar:sonar
          -Dsonar.organization=gabrielchv
          -Dsonar.projectKey=gabrielchv_${{ matrix.service }}
        working-directory: ${{ matrix.service }}
